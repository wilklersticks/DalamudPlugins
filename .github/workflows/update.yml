name: Update combined plugin list

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for an instant refresh
  push:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Merge plugin lists
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          # Add new plugin repos to this list.
          $repos = @('JumpLock', 'ReturnToSender')

          $all = [System.Collections.Generic.List[object]]::new()
          foreach ($r in $repos) {
            $url = "https://raw.githubusercontent.com/$owner/$r/main/pluginmaster.json"
            # If any list can't be read, stop without changing anything,
            # so a plugin never vanishes from the repo because of a hiccup.
            $list = Invoke-RestMethod -Uri $url -Headers @{ 'Cache-Control' = 'no-cache' }
            # Unpack each repo's list so the result is one flat list of plugins.
            foreach ($plugin in @($list | ForEach-Object { $_ })) {
              $all.Add($plugin)
              Write-Host "Added $($plugin.Name) $($plugin.AssemblyVersion) from $r"
            }
          }

          if ($all.Count -eq 0) { throw "No plugins found." }
          ConvertTo-Json -InputObject $all.ToArray() -Depth 10 | Set-Content pluginmaster.json -Encoding utf8

          # Sanity check: must be a flat list of plugin entries.
          $check = Get-Content pluginmaster.json -Raw | ConvertFrom-Json -NoEnumerate
          if ($check[0] -is [array] -or -not $check[0].InternalName) { throw "Merged file has the wrong shape." }
          Write-Host "Combined list has $($check.Count) plugin(s)."

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || (git commit -m "Update combined plugin list" && git push)
